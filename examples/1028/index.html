<body bgcolor=#80a0ff><font face=helvetica>

<input type=range id=angleSlider></input>VIEW ANGLE<br>
<input type=range id=lengthSlider></input>ARM LENGTH<br>
<input type=range id=widthSlider ></input>SHOULDER WIDTH<br>
<input type=range id=radiusSlider></input>LIMB THICKNESS<br>
<input type=range id=swingSlider ></input>ARM SWING<br>
<button onclick=flipColors()>FLIP COLORS</button>

<center><canvas id=canvas width=800 height=800></canvas>

<script src=library.js></script>
<script src=shape.js></script>
<script src=webgl3.js></script>
<script>

let flippedColors = 1, flipColors = () => flippedColors = 1 - flippedColors;

function Scene() {

   // PHONG PARAMETERS OF SOME COMMON MATERIALS

   let gold        = { ambient: [.3,.2,.0], diffuse: [.15,.1,0], specular: [.3,.2,.0,10] };
   let silver      = { ambient: [.2,.2,.2], diffuse: [.1,.1,.1], specular: [.2,.2,.2,10] };
   let redPlastic  = { ambient: [.2,.0,.0], diffuse: [.6,.0,.0], specular: [.1,.1,.1,10] };
   let bluePlastic = { ambient: [.0,.0,.2], diffuse: [.0,.0,.6], specular: [.1,.1,.1,10] };
   let pinkPlastic = { ambient: [.2,.1,.1], diffuse: [.6,.3,.3], specular: [.1,.1,.1,10] };
   let black       = { ambient: [.0,.0,.0], diffuse: [.0,.0,.0], specular: [.0,.0,.0,10] };

   // DEFINE VERTEX MAP, VERTEX SHADER AND FRAGMENT SHADER FOR THIS SCENE

   this.vertexSize = 8;
   this.vertexAttributes = {
      aPos: { size: 3, position: 0 },
      aNor: { size: 3, position: 3 },
      aUV:  { size: 2, position: 6 },
   };

   this.vertexShader = `#version 300 es
   in  vec3 aPos, aNor;
   in  vec2 aUV;
   out vec3 vPos, vNor;
   out vec2 vUV;
   uniform mat4 uMF, uMI;
   void main() {
      vec4 pos = uMF * vec4(aPos, 1.);
      vec4 nor = vec4(aNor, 0.) * uMI;
      vPos = pos.xyz / pos.w;
      vPos.z *= -1.;
      vNor = nor.xyz;
      vUV = aUV;
      gl_Position = vec4(vPos, 1.);
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;

   in  vec3 vPos, vNor;
   in  vec2 vUV;
   out vec4 fragColor;
   uniform vec3 uAmbient, uDiffuse;
   uniform vec4 uSpecular;

   vec3 La = vec3(-.7);                     // LIGHT SOURCE DIRECTIONS
   vec3 Lb = vec3( .7);

   vec3 W = vec3(0.,0.,-1.);                // DIRECTION FROM CAMERA INTO THE SCREEN

   void main() {
      vec3 N = normalize(vNor);             // PHONG SHADING FROM TWO LIGHT SOURCES
      vec3 R = 2. * dot(W,N) * N - W;
      vec3 color = uAmbient
         + uDiffuse * max(0.,dot(N,La)) + uSpecular.rgb * pow(max(0.,dot(R,La)), uSpecular.a)
         + uDiffuse * max(0.,dot(N,Lb)) + uSpecular.rgb * pow(max(0.,dot(R,Lb)), uSpecular.a);
      fragColor = vec4(sqrt(color),1.);
   }`;

   let startTime = Date.now() / 1000, blinkTime = 0, m = new Matrix();

   // DEFINE SHAPES THAT WE WILL USE IN THIS SCENE

   let sphere = Shape.sphere(16,8);

   // RENDER ONE ANIMATION FRAME

   this.update = () => {

      let time = Date.now() / 1000 - startTime;

      // RETRIEVE CURRENT VALUES FROM HTML SLIDERS

      let al = .20 * (.5 + lengthSlider.value/100);
      let sw = .18 * (.5 + widthSlider.value /100);
      let ar = .05 * (.5 + radiusSlider.value/100);
      let as = .30 * (.5 + swingSlider.value /100);

      // HANDLE EYE BLINK

      let b = time < blinkTime - .2;
      if (time > blinkTime)
         blinkTime += .5 + 2 * Math.random();

      // DEFINE THE CURRENT VIEW INTO THE SCENE

      m.identity();
      m.perspective(10);
      m.turnY((angleSlider.value/100-.5)*Math.PI);

      // DRAW THE HEAD AND EYES

      m.push();

         // ANIMATE THE HEAD

         m.move(0, .27 + .01 * Math.cos(8 * time), 0);

	 m.push();

	    // DRAW HEAD

            m.scale(.1,.12,.1);
	    draw(sphere, pinkPlastic, m);

	    // DRAW EYES

            for (let side = -1 ; side <= 1 ; side += 2) {
	       m.push();
	          m.turnY(side*.5);
	          m.turnX(-.2);
                  m.move(0,0,1);
                  m.scale(b*.25,b*.2,b*.05);
                  draw(sphere, black, m);
	       m.pop();
	    }
	 m.pop();

      m.pop();

      // DRAW THE LEFT AND RIGHT ARMS

      for (let side = -1 ; side <= 1 ; side += 2) {

         // RHYTHMIC MOTION TO SWING THE ARM

         let c = Math.cos(4 * time + side * Math.PI/2);
         let s = Math.sin(4 * time + side * Math.PI/2);

         m.push();

	    m.move(side * sw, 0, 0);   // PLACE THE SHOULDER

            m.turnX(as * c);           // ROTATE ABOUT SHOULDER
            m.move(0,-al,0);

	    m.push();                  // DRAW UPPER ARM
	       m.scale(ar,al,ar);
	       draw(sphere, flippedColors ? bluePlastic : redPlastic, m);
	    m.pop();

            m.move(0,-al,0);
            m.turnX(as * (s-1));       // ROTATE ABOUT ELBOW
            m.move(0,-al,0);

	    m.push();                  // DRAW LOWER ARM
	       m.scale(ar,al,ar);
	       draw(sphere, flippedColors ? redPlastic : bluePlastic, m);
	    m.pop();

         m.pop();
      }
   }
}

gl_start(canvas, new Scene());
</script>
