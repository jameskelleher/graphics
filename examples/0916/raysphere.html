<body bgcolor=#80a0ff>
<center><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

// Declare number of spheres and number of light sources

const NS = 50;
const NL = 2;

function Scene() {

   this.vertexShader = `#version 300 es
   in  vec3 aPos;
   out vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;

   // All uniforms (data values are sent from CPU)

   uniform float uTime;
   uniform vec4 uS[` + NS + `];
   uniform vec3 uL[` + NL + `];
   uniform vec3 uC[` + NL + `];

   in  vec3 vPos;
   out vec4 fragColor;

   // Focal length of the camera

   float fl = 3.;

   // A function to trace a ray to a sphere

   float raySphere(vec3 V, vec3 W, vec4 S) {
      V -= S.xyz;
      float r = S.w;
      float VW = dot(V, W);
      float VV = dot(V, V);
      float d = VW * VW - (VV - r*r);
      if (d < 0.)
         return -1.;
      return -VW - sqrt(d);
   }

// vec4 S[2];
// vec3 L = normalize(vec3(1.));

   void main() {
      //S[0] = vec4(0.,0.,-1.,.1);
      //S[1] = vec4(.2 + .1*sin(uTime),0.,-2.,.1);

      fragColor = vec4(0.);

      // Define the ray from the eye to this pixel

      vec3 V = vec3(0.);
      vec3 W = normalize(vec3(vPos.xy, -fl));

      // Find the nearest sphere along the ray

      float tMin = 1000.;
      for (int i = 0 ; i < ` + NS + ` ; i++) {
         float t = raySphere(V, W, uS[i]);
         if (t >= 0. && t < tMin) {

	    tMin = t;

            fragColor = vec4(1.);

            // Find the point on the sphere surface

	    vec3 P = V + t * W;

	    // Find the surface normal

            vec3 N = normalize(P - uS[i].xyz);

	    // Do diffuse shading

	    vec3 c = vec3(.2);
	    for (int j = 0 ; j < ` + NL + ` ; j++)
	       c += .8 * max(0., dot(N, uL[j])) * uC[j];

            // Do gamma color correction

	    fragColor = vec4(sqrt(c), 1.);
         }
      }
   }`;

   let startTime = Date.now() / 1000;

   this.update = () => {

      // Send current time to fragment shader

      let time = Date.now() / 1000 - startTime;
      setUniform('1f', 'uTime', time);

      // Send spheres data to fragment shader

      //let y = .1 * Math.sin(time);
      //setUniform('4fv', 'uS', [0,y,-1,.1, .2,0,-2,.1]);

      let S = [];
      let radius = .5;
      for (let i = 0 ; i < NS ; i++) {
         let theta = 2 * Math.PI * i / NS + time / 10;
         S.push(radius * Math.sin(2 * theta),
	        radius * Math.cos(theta),
	        -2.5 + .3 * Math.sin(5 * theta), .1);
      }

      setUniform('4fv', 'uS', S);

      // Sen light source directions to fragment shader

      let L = [2,1,1, 0,-1,0];

      // Normalize light source direction vectors

      for (let j = 0 ; j < NL ; j++) {
         let x = L[3*j], y = L[3*j+1], z = L[3*j+2];
	 let r = Math.sqrt(x*x + y*y + z*z);
	 L[3*j  ] = x/r;
	 L[3*j+1] = y/r;
	 L[3*j+2] = z/r;
      }
      setUniform('3fv', 'uL', L);

      // Send light source colors to fragment shader

      setUniform('3fv', 'uC', [.5,.75,1., .5,.2,.1]);
   }

}

gl_start(canvas, new Scene());
</script>
