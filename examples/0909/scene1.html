<body bgcolor=black>
<center><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

function Scene() {

   this.vertexShader = `#version 300 es
   in  vec3 aPos;
   out vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;
   in  vec3 vPos;
   out vec4 fragColor;
   void main() {
      // fragColor = vec4(vec3(0.1 + vPos.z), 1.);
      // fragColor = vec4(0., 0., .5, 1.);
      fragColor = vec4(.5 + .5 * vPos, 1.);
   }`;
} 

gl_start(canvas, new Scene());
</script>
</center></body>
