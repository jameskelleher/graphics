<body bgcolor=black>
<center><canvas id=canvas width=800 height=800></canvas>
<script src=webgl.js></script>
<script>

function Scene() {

   this.vertexShader = `#version 300 es
   in  vec3 aPos;
   out vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;
   uniform float uTime;
   in  vec3 vPos;
   out vec4 fragColor;
   void main() {

   // SET A COLOR FOR THIS FRAGMENT.

      // mix(A , B , float)

      vec3 rgb = mix(vec3(.2,.05,.05), vec3(0.,.3,1.), .5 + .5 * vPos.y);

      for (int i = 0 ; i < 20 ; i++) {

         float x = 8. * vPos.x + 4. * sin(15. * float(i) + 100. + .3 * uTime);
         float y = 8. * vPos.y + 4. * cos(17. * float(i) + 200. + .3 * uTime);

         vec3 lightDir = normalize(vec3(sin(uTime),1.,1.));

         float rr = 1. - x*x - y*y;
         if (x > y && rr > 0.) {
            float z = sqrt(rr);
            float b = max(0., dot(vec3(x,y,z), lightDir));
            rgb = vec3(.1,.05,.05) + .8 * vec3(b) * vec3(.2,.5,1.);
            rgb *= 1. + .5 * sin(3. * vec3(x,y,z + .1 * uTime));
         }
      }

      fragColor = vec4(sqrt(rgb), 1.0);
   }`;

   let startTime = Date.now() / 1000;

   this.update = () => {
      setUniform('1f', 'uTime', Date.now() / 1000 - startTime);
   }
}

gl_start(canvas, new Scene());
</script>
