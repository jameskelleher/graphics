<body bgcolor=#80a0ff><font face=helvetica>

<input type=range id=lengthSlider></input>ARM LENGTH<br>
<input type=range id=widthSlider ></input>SHOULDER WIDTH<br>
<input type=range id=radiusSlider></input>LIMB THICKNESS<br>
<input type=range id=swingSlider ></input>ARM SWING<br> -->
<label>
  <input type="checkbox" name="rotateBike" id="rotateBike">
  rotate bike
</label>

<center><canvas id=canvas width=900 height=900></canvas></center>

<script src=library.js></script>
<script src=shape.js></script>
<script src=webgl3.js></script>
<script>

function Scene() {

   // PHONG PARAMETERS OF SOME COMMON MATERIALS

   let gold        = { ambient: [.3,.2,.0], diffuse: [.15,.1,0], specular: [.3,.2,.0,10] };
   let silver      = { ambient: [.2,.2,.2], diffuse: [.1,.1,.1], specular: [.2,.2,.2,10] };
   let redPlastic  = { ambient: [.2,.0,.0], diffuse: [.6,.0,.0], specular: [.1,.1,.1,10] };
   let bluePlastic = { ambient: [.0,.0,.2], diffuse: [.0,.0,.6], specular: [.1,.1,.1,10] };
   let pinkPlastic = { ambient: [.2,.1,.1], diffuse: [.6,.3,.3], specular: [.1,.1,.1,10] };
   let black       = { ambient: [.0,.0,.0], diffuse: [.0,.0,.0], specular: [.0,.0,.0,10] };

   // DEFINE VERTEX MAP, VERTEX SHADER AND FRAGMENT SHADER FOR THIS SCENE

   this.vertexSize = 8;
   this.vertexAttributes = {
      aPos: { size: 3, position: 0 },
      aNor: { size: 3, position: 3 },
      aUV:  { size: 2, position: 6 },
   };

   this.vertexShader = `#version 300 es
   in  vec3 aPos, aNor;
   in  vec2 aUV;
   out vec3 vPos, vNor;
   out vec2 vUV;
   uniform mat4 uMF, uMI;
   void main() {
      vec4 pos = uMF * vec4(aPos, 1.);
      vec4 nor = vec4(aNor, 0.) * uMI;
      vPos = pos.xyz / pos.w;
      vPos.z *= -1.;
      vNor = nor.xyz;
      vUV = aUV;
      gl_Position = vec4(vPos, 1.);
   }`;

   this.fragmentShader = `#version 300 es
   precision highp float;

   in  vec3 vPos, vNor;
   in  vec2 vUV;
   out vec4 fragColor;
   uniform vec3 uAmbient, uDiffuse;
   uniform vec4 uSpecular;

   vec3 La = vec3(-.7);                     // LIGHT SOURCE DIRECTIONS
   vec3 Lb = vec3( .7);

   vec3 W = vec3(0.,0.,-1.);                // DIRECTION FROM CAMERA INTO THE SCREEN

   void main() {
      vec3 N = normalize(vNor);             // PHONG SHADING FROM TWO LIGHT SOURCES
      vec3 R = 2. * dot(W,N) * N - W;
      vec3 color = uAmbient
         + uDiffuse * max(0.,dot(N,La)) + uSpecular.rgb * pow(max(0.,dot(R,La)), uSpecular.a)
         + uDiffuse * max(0.,dot(N,Lb)) + uSpecular.rgb * pow(max(0.,dot(R,Lb)), uSpecular.a) * 0.;
      fragColor = vec4(sqrt(color),1.);
   }`;

   let startTime = Date.now() / 1000, m = new Matrix();

   // DEFINE SHAPES THAT WE WILL USE IN THIS SCENE

   // let sphere = Shape.sphere(16,8);
   let tire = Shape.torus(5, .5, 32, 8);
   let wheel = Shape.torus(4.7, .4, 32, 8);
   let spoke = Shape.cylinder(8);
   let shaft = Shape.cylinder(16);
   let bikePart = Shape.cylinder(8);
   let joint = Shape.sphere(16, 16);


   // RENDER ONE ANIMATION FRAME

   let drawLeg = time => {

      let dx = 2.6, dy = -6.8;
      let a = 3.9, b = 4.6;

      let HIP = [0, 0, 0];
         m.move(HIP[0], HIP[1], HIP[2]);

         // hip
         m.push();
            m.scale(1.1);
            draw(joint, gold, m);
         m.pop();

         let x = dx + 2 * Math.cos(-time)/2;
         let y = dy + 2 * Math.sin(-time)/2
         let C = [x, y, 0];
         let D = [1, 0, 0];

         ik(a, b, C, D);

         // thigh
         m.push();
            dx = D[0]/2; dy = D[1]/2; dz = D[2]/2;
            theta = Math.atan2(dy, dx);
            m.move(dx, dy, dz);
            m.turnZ(theta);
            m.scale(a*.6, 0.8, 0.8);
            draw(joint, silver, m);
         m.pop();
            
         // knee
         m.push();
            m.move(D[0], D[1], D[2]);
            m.scale(.8);
            draw(joint, gold, m);
         m.pop();
            
         // shin
         m.push();
            dx = (C[0]+D[0])/2; dy = (C[1]+D[1])/2; dz = (C[2]+D[2])/2;
            theta = Math.atan2(C[1]-D[1], C[0]-D[0]);
            m.move(dx, dy, dz);
            m.turnZ(theta);
            m.scale(b*.6, 0.5, 0.5);
            draw(joint, silver, m);
         m.pop();
         
         // foot
         m.move(C[0], C[1], C[2]);
         draw(joint, gold, m);
   }

   let drawArm = (time, radius) => {
      m.push();

         m.move(0, 0, 2 * Math.sign(radius));

         m.push();
            m.scale(0.85);
            draw(joint, gold, m);
         m.pop();

         let dz = radius - 2 * Math.sign(radius);

         let s = Math.sin(time) * radius;
         let c = Math.cos(time) * radius;

         let C = [4.2 + s, -2.3, dz + c];
         let D = [0, -1, 0];

         let scl = 3.1;
         ik(.8 * scl, scl, C, D);

         // ARM
         m.push();
            theta = Math.atan2(D[1], D[0]);
            m.move(D[0]/2, D[1]/2, D[2]/2);
            m.turnZ(theta);
            m.scale(1, .6, .6);
            draw(joint, silver, m)
         m.pop();

         // ELBOW
         m.push();
            m.move(D[0], D[1], D[2]);
            m.scale(.6);
            draw(joint, gold, m);
         m.pop();

         // FOREARM
         m.push();
            dx = (C[0]+D[0])/2, dy = (C[1]+D[1])/2, dz = (C[2]+D[2])/2;
            let thetaY = Math.atan2(dz, dx);
            let thetaZ = Math.atan2(dy, dx);
            m.move(dx, dy, dz);
            m.turnZ(thetaY);
            // m.turnY(thetaY);
            m.scale(1.3, .5, .5);
            draw(joint, silver, m);
         m.pop();

         // HAND
         m.move(C[0], C[1], C[2]);
         m.scale(.7);
         draw(joint, gold, m);
      m.pop();
   }

   let drawBike = (pedalTime, noiseTime) => {
      m.push();
         m.move(-6, -4, 0);
            
         // REAR WHEEL
         m.push();
            m.scale(.6, .6, .6);
            drawWheel(pedalTime);
         m.pop();

         m.turnY(Math.PI/2);
         m.turnX(-Math.PI/4-.1);
         m.move(-.4, 0, 2.3);

         // BACK RIGHT BAR
         m.push();
            m.scale(.2, .2, 2.5);
            draw(bikePart, redPlastic, m);
         m.pop();

         m.move(.8, 0, 0);

         // BACK LEFT BAR
         m.push()
            m.scale(.2, .2, 2.5);
            draw(bikePart, redPlastic, m);
         m.pop();

         m.move(-.4, 0, 2.5);

         
         m.push();

            m.turnX(Math.PI-1.05);

            // SILVER SEAT BAR
            m.push()
               m.move(0, 0, -.8);
               m.scale(.18, .18, .5);
               draw(bikePart, silver, m);
            m.pop();

            m.move(0, 0, 2.3);

            // RED SEAT BAR
            m.push();
               m.scale(.2, .2, 2.8);
               draw(bikePart, redPlastic, m);
            m.pop();

            // BOTTOM BAR
            m.move(0, 0, 2.7);
            m.turnX(-2 * Math.PI/3 + .1);
            m.move(0, 0, 3.5);
            m.scale(.2, .2, 3.6);
            draw(bikePart, redPlastic, m);

         m.pop();

         m.turnX(Math.PI/8+.3);
         m.move(0, 0, 3.3);

         // TOP BAR
         m.push();
            m.scale(.18, .18, 3.3);
            draw(bikePart, redPlastic, m);
         m.pop();

         m.move(0, 0, 3.3);

         m.turnX(Math.PI/2-.2);
         m.turnZ(Math.sin(-noiseTime));
         m.move(0, 0, 1.05-.5);

         // LITTLE CONNECTING BAR
         m.push();
            m.scale(.18, .18, 1.05);
            draw(bikePart, redPlastic, m);
         m.pop();

         m.move(0, 0, 1.05)
         m.turnX(-.1);

         m.push();
            m.move(.4, 0, 2);
            m.scale(.18, .18, 2);
            draw(bikePart, redPlastic, m);
         m.pop();

         m.push();
            m.move(-.4, 0, 2);
            m.scale(.18, .18, 2);
            draw(bikePart, redPlastic, m);
         m.pop();

         m.move(0, 0, 4);
         m.turnZ(-Math.PI/2)
         m.turnX(Math.PI/2);
         m.scale(.6, .6, .6);
         drawWheel(pedalTime);

      m.pop();
   
      // m.push();
      //    m.move(6, -4, 0);

      //    m.turnY(Math.sin(noiseTime))
      //    // FRONT WHEEL
      //    m.push();
      //       m.scale(.6, .6, .6);
      //       drawWheel(pedalTime);
      //    m.pop();
      // m.pop();
   }

   let drawWheel = time => {
      m.turnZ(-time/2);
      m.turnX(Math.PI / 2);

      draw(tire, black, m);
      draw(wheel, silver, m);


      let numSpokes = 12;
      for (let i = 0; i < numSpokes; i++) {
         m.push();
            m.turnY(i * 2 * Math.PI / numSpokes);
            m.scale(.1, .1, 2.3);
            m.move(0, 0, -1.2);
            draw(spoke, silver, m);
         m.pop();
      }

      m.turnX(Math.PI/2);
      m.scale(.45, .45, 1);
      draw(shaft, black, m);
   }

   this.update = () => {

      let time = Date.now() / 1000 - startTime;
      let noiseTime = 1.9 * noise(time, 1, 1.5);

      let pedalTime = time * 4;
      let theta, dx, dy, dz;

      m.identity();
      m.perspective(10);
      m.scale(.1, .1, .1);
      m.move(0, -2, 0);

      if (document.getElementById('rotateBike').checked)
         m.turnY(time/3);

      m.turnZ(Math.sin(.5 * noise(time/5, 500, 500)));

      m.turnX(Math.sin(-noiseTime*.3));


      // draw(tire, black, m);
      m.push()
         m.move(-3.8, 1.8, 0);

         // RIGHT LEG
         m.push()
            m.move(0, 0, 1.5);
            drawLeg(pedalTime);
         m.pop()

         // LEFT LEG
         m.push()
            m.move(0, 0, -1.5);
            drawLeg(pedalTime + Math.PI);
         m.pop();

         let bodyRot = -Math.PI/4 + .4

         m.turnZ(bodyRot);
         m.move(0, 2.5, 0);

         // BODY
         m.push();
            m.scale(1.5, 3, 2);
            draw(joint, silver, m);
         m.pop();

         m.move(0, 2.2, 0);

         m.push();
            m.move(0, 2, 0);
            m.scale(1.2)
            draw(joint, gold, m);
         m.pop();
         m.turnZ(-bodyRot)

         let radius = 1;

         drawArm(noiseTime, radius);
         drawArm(noiseTime, -radius);

      m.pop();
      
      drawBike(pedalTime, noiseTime);

      // console.log(noise(time, 200, 500));
         
   }
}

gl_start(canvas, new Scene());
</script>

</body>
